# Release builds — cross-compiled binaries for Termux/Android and Linux.
#
# Triggers:
#   - pushing a tag like v0.7.0  → builds all targets, creates the GitHub
#     Release and uploads `laudacode-<tag>-<target>.tar.gz` + SHA256SUMS
#   - workflow_dispatch (manual, e.g. from a branch) → builds artifacts only,
#     no release — used to validate changes before tagging
#
# Termux note: android-* targets link against Bionic at API 24 (Android 7,
# Termux's minimum) using the NDK toolchain preinstalled on GitHub runners.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Termux / Android (Bionic, API 24)
          - target: aarch64-linux-android
            tool: ndk
          - target: armv7-linux-androideabi
            tool: ndk
          - target: x86_64-linux-android
            tool: ndk
          - target: i686-linux-android
            tool: ndk
          # Static Linux
          - target: x86_64-unknown-linux-musl
            tool: zigbuild
          - target: aarch64-unknown-linux-musl
            tool: zigbuild

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      # ring (via reqwest/rustls) compiles C+asm, so NDK clang must be wired
      # into cargo's target env: linker, CC and AR.
      - name: Set up Android NDK
        if: matrix.tool == 'ndk'
        run: |
          set -eu
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | tail -n 1)}"
          [ -d "$NDK" ] || { echo "Android NDK not found on runner"; exit 1; }
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.target }}" in
            aarch64-linux-android)   triple=aarch64-linux-android ;;
            armv7-linux-androideabi) triple=armv7a-linux-androideabi ;;
            x86_64-linux-android)    triple=x86_64-linux-android ;;
            i686-linux-android)      triple=i686-linux-android ;;
            *) echo "unknown android target"; exit 1 ;;
          esac
          UPPER="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          {
            echo "CARGO_TARGET_${UPPER}_LINKER=${BIN}/${triple}24-clang"
            echo "CC_${UPPER}=${BIN}/${triple}24-clang"
            echo "CXX_${UPPER}=${BIN}/${triple}24-clang++"
            echo "AR_${UPPER}=${BIN}/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Install cargo-zigbuild (musl targets)
        if: matrix.tool == 'zigbuild'
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build
        run: |
          set -eu
          if [ "${{ matrix.tool }}" = "zigbuild" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          set -eu
          BIN="target/${{ matrix.target }}/release/laudacode"
          test -f "$BIN" || { echo "binary missing for ${{ matrix.target }}"; exit 1; }
          NAME="laudacode-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p stage
          cp "$BIN" stage/laudacode
          tar -C stage -czf "$NAME.tar.gz" laudacode
          sha256sum "$NAME.tar.gz" | tee sha256sums.partial
          echo "ARTIFACT=$NAME.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            sha256sums.partial
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Merge checksums
        working-directory: dist
        run: cat sha256sums.* | sort -k2 > SHA256SUMS && rm sha256sums.* && cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
