# Release builds — cross-compiled binaries for Termux/Android and Linux.
#
# Trigger:
#   - pushing a tag like v0.7.0 → builds all targets, creates the GitHub
#     Release and uploads `laudacode-<tag>-<target>.tar.gz` + SHA256SUMS
#
# The workflow cannot be run manually (no workflow_dispatch) and every job
# is guarded so it only runs for pushes made by the repository owner.
#
# Termux note: android-* targets link against Bionic at API 24 (Android 7,
# Termux's minimum) using the NDK toolchain preinstalled on GitHub runners.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          # Termux / Android (Bionic, API 24)
          - target: aarch64-linux-android
            tool: ndk
          - target: armv7-linux-androideabi
            tool: ndk
          - target: x86_64-linux-android
            tool: ndk
          - target: i686-linux-android
            tool: ndk
          # Static Linux (musl: runs on any distro/arch, preferred)
          - target: x86_64-unknown-linux-musl
            tool: zigbuild
          - target: aarch64-unknown-linux-musl
            tool: zigbuild
          # Dynamic Linux/glibc builds ("normal" GNU-linked binaries)
          - target: x86_64-unknown-linux-gnu
            tool: zigbuild
          - target: aarch64-unknown-linux-gnu
            tool: zigbuild

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      # ring (via reqwest/rustls) compiles C+asm, so NDK clang must be wired
      # into cargo's target env: linker, CC and AR.
      - name: Set up Android NDK
        if: matrix.tool == 'ndk'
        run: |
          set -eu
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | tail -n 1)}"
          [ -d "$NDK" ] || { echo "Android NDK not found on runner"; exit 1; }
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.target }}" in
            aarch64-linux-android)   triple=aarch64-linux-android ;;
            armv7-linux-androideabi) triple=armv7a-linux-androideabi ;;
            x86_64-linux-android)    triple=x86_64-linux-android ;;
            i686-linux-android)      triple=i686-linux-android ;;
            *) echo "unknown android target"; exit 1 ;;
          esac
          # cc-rs reads CC_/CXX_/AR_ with the LOWERCASE target triple
          # (dashes -> underscores, e.g. CC_i686_linux_android), while cargo's
          # linker override is UPPERCASE (CARGO_TARGET_I686_LINUX_ANDROID_LINKER).
          UPPER="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          LOWER="$(echo '${{ matrix.target }}' | tr '-' '_')"
          {
            echo "CARGO_TARGET_${UPPER}_LINKER=${BIN}/${triple}24-clang"
            echo "CC_${LOWER}=${BIN}/${triple}24-clang"
            echo "CXX_${LOWER}=${BIN}/${triple}24-clang++"
            echo "AR_${LOWER}=${BIN}/llvm-ar"
          } >> "$GITHUB_ENV"

      # pip3 install on ubuntu-24.04 (ubuntu-latest) is blocked by PEP 668
      # (externally-managed environment), so install zig via the upstream setup
      # action instead of the PyPI `ziglang` wrapper.
      - name: Install zig (musl targets)
        if: matrix.tool == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Install cargo-zigbuild (musl targets)
        if: matrix.tool == 'zigbuild'
        run: command -v cargo-zigbuild >/dev/null 2>&1 || cargo install --locked cargo-zigbuild

      - name: Build
        run: |
          set -eu
          if [ "${{ matrix.tool }}" = "zigbuild" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          set -eu
          BIN="target/${{ matrix.target }}/release/laudacode"
          test -f "$BIN" || { echo "binary missing for ${{ matrix.target }}"; exit 1; }
          NAME="laudacode-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p stage
          cp "$BIN" stage/laudacode
          tar -C stage -czf "$NAME.tar.gz" laudacode
          # per-target name so the files don't collide when the release job
          # merges artifacts with download-artifact --merge-multiple
          sha256sum "$NAME.tar.gz" | tee "sha256sums.${{ matrix.target }}"
          echo "ARTIFACT=$NAME.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            sha256sums.*
          if-no-files-found: error

  release:
    needs: build
    if: github.actor == github.repository_owner && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Merge checksums
        working-directory: dist
        run: cat sha256sums.* | sort -k2 > SHA256SUMS && rm sha256sums.* && cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
